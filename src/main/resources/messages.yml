# TickBlade 訊息檔
# 顏色碼用 &，變數用 {名稱}
# 缺少的項目會在啟動與重載時自動補回，原本的文字會保留
messages-version: 1

common:
  no-permission: "&c你沒有權限使用這個指令。"
  player-only: "&c這個指令只能由玩家執行。"
  op-level-required: "&c需要 OP 等級 {level} 以上才能使用。"
  unknown-subcommand: "&c未知的子指令，輸入 &e/{label} help &c查看說明。"
  reload-done: "&a已重新載入 config.yml 與 messages.yml。"
  reload-failed: "&c重新載入失敗：{error}（詳細內容請看後台）"

help:
  header: "&6===== TickBlade &ev{version} &6====="
  line: "&e/{label} {usage} &7- {description}"
  entries:
    status: "查看 MSPT、降載等級、AI 暫停與卡頓統計"
    hotspots: "開啟熱點區塊介面"
    inspect: "看著一隻生物執行，查看 TickBlade 對它的判斷"
    reports: "列出已存檔的 spark 報告"
    profile: "立即錄一份只含長 tick 的 spark 報告"
    cleanup: "立即檢查所有已載入的怪物是否該恢復消失"
    ai-restore: "恢復所有被暫停的生物 AI"
    reload: "重新載入設定檔"
    version: "顯示版本並檢查更新"

version:
  current: "&7目前版本：&ev{version}"
  checking: "&7正在檢查 GitHub 最新版本…"
  disabled: "&7更新檢查已在 config.yml 關閉。"
  newer: "&a有新版本：&ev{latest}&a（目前 v{version}）&7 {url}"
  latest: "&a已是最新版本。"
  dev: "&e目前版本比 GitHub 新（開發版）。&7GitHub 最新：v{latest}"
  failed: "&c檢查更新失敗：{reason}"
  join-notify: "&aTickBlade 有新版本 &ev{latest}&a（目前 v{version}）&7 {url}"
  reason-no-release: "尚無發布版本"
  reason-http: "HTTP {code}"
  reason-network: "無法連線"

status:
  header: "&6===== TickBlade 狀態 ====="
  mspt: "&7平均 MSPT（{seconds} 秒）：{color}{mspt} ms &7｜最近 1 tick：{last} ms"
  shedding: "&7降載等級：&e{level}&7/{max}  &7模擬距離 {sim}｜視距 {view}"
  shedding-off: "&7降載：&8已關閉"
  shedding-none: "&7降載等級：&a0&7（正常）"
  ai: "&7AI 暫停中：&e{paused} &7隻（擁擠 {crowd}｜被關住 {confined}）｜暫時喚醒 {woken}"
  ai-off: "&7AI 暫停：&8已關閉"
  despawn: "&7消失判斷：本次啟動已修正 &e{fixed} &7隻（掉落方塊 {blocks}｜掉落物品 {items}）｜阻止撿方塊 {blocked} 次"
  despawn-off: "&7消失判斷：&8已關閉"
  spikes: "&7卡頓（≥{threshold} ms）：本次啟動 &e{total} &7次｜最高 {max} ms｜最近：{last}"
  spikes-none: "無"
  profile-running: "&7spark 自動錄製：&e錄製中&7（剩餘約 {seconds} 秒）"
  profile-idle: "&7spark 自動錄製：待命｜已存 {count} 份報告"

spike:
  profile-started: "&e卡頓次數達到門檻，已開始錄製 spark 報告（{seconds} 秒，只記錄超過 {over} ms 的 tick）。"
  profile-manual-started: "&e已開始錄製 spark 報告（{seconds} 秒，只記錄超過 {over} ms 的 tick）。"
  profile-saved: "&a已存檔 spark 報告：&f{file}&7（{size}）。把檔案拖進 https://spark.lucko.me 即可查看。"
  profile-failed: "&c錄製 spark 報告失敗：{reason}"
  profile-busy: "&espark 目前已有其他錄製在進行，略過這次自動錄製。"
  profile-cooldown: "&e自動錄製冷卻中，還要 {minutes} 分鐘。"
  profile-already: "&e已經在錄製中了。"
  no-spark: "&c找不到 spark（Paper 內建的 spark 被關閉了嗎？），無法錄製報告。"
  reason-timeout: "等太久沒有收到 spark 的存檔結果"
  reason-move: "無法搬移報告檔"

reports:
  header: "&6===== spark 報告（{count} 份，{size}）====="
  line: "&e{file} &7{size}  {date}"
  empty: "&7目前沒有報告。"
  footer: "&7位置：plugins/TickBlade/reports/，拖進 https://spark.lucko.me 即可查看。"

shedding:
  raised: "&e伺服器負載偏高（平均 {mspt} ms），降載等級 {from} → {to}：模擬距離 {sim}、視距 {view}"
  lowered: "&a伺服器負載恢復（平均 {mspt} ms），降載等級 {from} → {to}"
  unchanged: "不變"

ai:
  usage: "&e用法：/{label} ai restore &7（恢復所有被暫停的生物 AI）"
  restored: "&a已恢復 {count} 隻生物的 AI。"

